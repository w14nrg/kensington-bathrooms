name: Verify final launch branch

on:
  push:
    branches:
      - fix/selfhost-shop-photo-phone-reveal-2026-09-28
    paths:
      - .github/workflows/verify-final-launch.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/selfhost-shop-photo-phone-reveal-2026-09-28
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Build
        run: npm run build
      - name: Verify launch output
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def ok(name, cond):
              print(("PASS " if cond else "FAIL ") + name)
              if not cond:
                  raise SystemExit(1)

          cfg=json.loads(Path("src/config/site.json").read_text())
          ok("indexable true", cfg["site"]["indexable"] is True)

          robots=Path("dist/robots.txt").read_text()
          print("--- robots.txt ---")
          print(robots)
          ok("robots allows crawling", "Allow: /" in robots)
          ok("robots references sitemap", "https://kensingtonbathrooms.uk/sitemap.xml" in robots)

          sitemap=Path("dist/sitemap.xml").read_text()
          ok("sitemap exists", bool(sitemap.strip()))
          ok("projects excluded from sitemap", "/projects/" not in sitemap)

          projects=Path("dist/projects/index.html").read_text()
          home=Path("dist/index.html").read_text()
          about=Path("dist/about/index.html").read_text()
          ok("Projects noindex", 'noindex, nofollow' in projects)
          ok("homepage indexable", 'noindex, nofollow' not in home)
          ok("WhatsApp us rendered", "WhatsApp us" in home)
          ok("whatsapp click tracking rendered", 'data-track="whatsapp_click"' in home)
          ok("self-hosted About photo rendered", "/images/about/en-suites-shop-munster-road.webp" in about)
          ok("no external En-Suites GitHub photo URL", "raw.githubusercontent.com/w14nrg/en-suite-bathrooms" not in about)

          all_html="\n".join(p.read_text(errors="ignore") for p in Path("dist").rglob("*.html"))
          ok("no en-suite.co.uk domain in HTML", "en-suite.co.uk" not in all_html)
          ok("no old 7386 phone fragment in HTML", "7386" not in all_html)

          ok("hidden phone reveal CSS", ".drawer__phone-reveal[hidden]{display:none}" in home)
          PY
