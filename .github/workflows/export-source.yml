name: Export Kensington Bathrooms source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: 354ae2a8c48641346a2c3a75c590150bc17a0bd4
          path: source

      - name: Create source zip
        run: |
          cd source
          zip -qr ../kensington-bathrooms-latest-354ae2a.zip . -x ".git/*"

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: kensington-bathrooms-source-354ae2a
          path: kensington-bathrooms-latest-354ae2a.zip
          if-no-files-found: error
