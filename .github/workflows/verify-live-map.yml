name: Verify live homepage map after deploy

on:
  push:
    branches:
      - feature/chatgpt-premium-build

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check live homepage animation
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'no-preference'}]);
              const res=await page.goto('https://kensingtonbathrooms.uk/?deploy=b257203',{waitUntil:'domcontentloaded'});
              if(!res || res.status()!==200) throw new Error('live homepage status '+(res&&res.status()));
              const state=await page.evaluate(()=>({
                jsMotion:document.documentElement.classList.contains('js-motion'),
                road:getComputedStyle(document.querySelector('.map-art>g:nth-of-type(1) path')).animationName,
                pins:[...document.querySelectorAll('.map-point__button')].map(x=>({name:getComputedStyle(x).animationName,delay:getComputedStyle(x).animationDelay,opacity:Number(getComputedStyle(x).opacity)})),
                pulse:getComputedStyle(document.querySelector('.map-point--local-base .map-point__symbol'),'::before').animationName,
                noindex:document.querySelector('meta[name="robots"]')?.content
              }));
              if(!state.jsMotion||state.road!=='kb-map-draw'||state.pins.some(x=>x.name!=='kb-pin-drop')||state.pulse!=='kb-local-pulse') throw new Error('live animation markers wrong '+JSON.stringify(state));
              console.log('LIVE_HOME_OK',JSON.stringify(state));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
