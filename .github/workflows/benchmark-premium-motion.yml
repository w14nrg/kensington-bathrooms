name: Benchmark premium motion candidate

on:
  push:
    branches:
      - feature/chatgpt-premium-build

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: ce4985458ead8be56e6c836b6aaa3392f2dc09ca
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: 7bf13ef7bbd90e61a9168ed21c49a43bd2c319b8
          path: candidate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build both
        run: |
          set -euo pipefail
          (cd baseline && npm run build)
          (cd candidate && npm run build)

      - name: Prove text, SEO, schema and page structure are unchanged
        run: |
          set -euo pipefail
          cmp baseline/dist/sitemap.xml candidate/dist/sitemap.xml
          cmp baseline/dist/robots.txt candidate/dist/robots.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          b=Path('baseline/dist')
          c=Path('candidate/dist')
          bhtml=sorted(p.relative_to(b) for p in b.rglob('*.html'))
          chtml=sorted(p.relative_to(c) for p in c.rglob('*.html'))
          assert bhtml==chtml
          def without_inline_css(text):
              return re.sub(r'<style>.*?</style>','<style></style>',text,flags=re.S)
          for rel in bhtml:
              before=(b/rel).read_text()
              after=(c/rel).read_text()
              assert without_inline_css(before)==without_inline_css(after), rel
          print('HTML_CONTENT_SCHEMA_STRUCTURE_IDENTICAL',len(bhtml),'pages')
          PY

      - name: Serve baseline and candidate
        run: |
          python3 -m http.server 4173 -d baseline/dist >/tmp/kb-base.log 2>&1 &
          python3 -m http.server 4174 -d candidate/dist >/tmp/kb-candidate.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ >/dev/null
          curl --fail http://127.0.0.1:4174/areas/holland-park/ >/dev/null

      - name: Lighthouse mobile before and after
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME=$CHROME"
          for spec in             "before-home|http://127.0.0.1:4173/"             "after-home|http://127.0.0.1:4174/"             "before-area|http://127.0.0.1:4173/areas/holland-park/"             "after-area|http://127.0.0.1:4174/areas/holland-park/"
          do
            name="${spec%%|*}"
            url="${spec#*|}"
            npx -y lighthouse@12.2.1 "$url"               --only-categories=performance               --output=json               --output-path="/tmp/${name}.json"               --chrome-path="$CHROME"               --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"               --quiet
          done
          node <<'NODE'
          const fs=require('fs');
          for (const name of ['before-home','after-home','before-area','after-area']) {
            const j=JSON.parse(fs.readFileSync('/tmp/'+name+'.json','utf8'));
            const perf=Math.round(j.categories.performance.score*100);
            const lcp=j.audits['largest-contentful-paint'].numericValue;
            const cls=j.audits['cumulative-layout-shift'].numericValue;
            console.log('LIGHTHOUSE',name,'performance='+perf,'lcp_ms='+Math.round(lcp),'cls='+cls.toFixed(4));
          }
          NODE

      - name: Mobile overflow and JS-disabled visibility
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              for (const width of [360,390,412]) {
                for (const path of ['/', '/areas/holland-park/']) {
                  const page=await browser.newPage();
                  await page.setViewport({width,height:844,deviceScaleFactor:1});
                  await page.goto('http://127.0.0.1:4174'+path,{waitUntil:'networkidle0'});
                  const dims=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
                  if (dims.scrollWidth > dims.clientWidth + 1) throw new Error('horizontal overflow '+width+' '+path+' '+JSON.stringify(dims));
                  console.log('OVERFLOW_OK',width,path,dims.scrollWidth,dims.clientWidth);
                  await page.close();
                }
              }

              for (const path of ['/', '/areas/holland-park/']) {
                const page=await browser.newPage();
                await page.setJavaScriptEnabled(false);
                await page.setViewport({width:390,height:844,deviceScaleFactor:1});
                await page.goto('http://127.0.0.1:4174'+path,{waitUntil:'networkidle0'});
                const check=await page.evaluate(()=>{
                  const h1=document.querySelector('h1');
                  const below=document.querySelector('.map-reading__blocks,.content-band');
                  const visible=(el)=>!!el && getComputedStyle(el).display!=='none' && getComputedStyle(el).visibility!=='hidden' && Number(getComputedStyle(el).opacity)>0;
                  return {h1:visible(h1),below:visible(below),text:(document.querySelector('main')?.innerText||'').length};
                });
                if (!check.h1 || !check.below || check.text < 200) throw new Error('JS-disabled visibility failed '+path+' '+JSON.stringify(check));
                console.log('NO_JS_VISIBLE',path,JSON.stringify(check));
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Package review ZIP
        run: |
          cd candidate
          zip -qr ../kensington-bathrooms-premium-motion-7bf13ef.zip . -x ".git/*" "dist/*"

      - name: Upload review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kensington-bathrooms-premium-motion-7bf13ef
          path: kensington-bathrooms-premium-motion-7bf13ef.zip
          if-no-files-found: error
