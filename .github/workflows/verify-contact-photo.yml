name: Verify contact/photo update

on:
  push:
    branches:
      - fix/selfhost-shop-photo-phone-reveal-2026-09-28
    paths:
      - .github/workflows/verify-contact-photo.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/selfhost-shop-photo-phone-reveal-2026-09-28

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build and verify requested changes only
        run: |
          set -euo pipefail
          npm run build

          test -f public/images/about/en-suites-shop-munster-road.webp
          test -s public/images/about/en-suites-shop-munster-road.webp

          grep -q 'src="/images/about/en-suites-shop-munster-road.webp"' src/pages/about.mjs
          grep -q 'width="1050" height="1400"' src/pages/about.mjs
          grep -q 'alt="Shopfront of the En-Suites & Bathrooms shop on Munster Road, Fulham"' src/pages/about.mjs
          grep -q '<figcaption>En-Suites & Bathrooms shop, Munster Road, Fulham</figcaption>' src/pages/about.mjs
          ! grep -q 'raw.githubusercontent.com/w14nrg/en-suite-bathrooms' src/pages/about.mjs

          grep -Fq '.drawer__phone-reveal[hidden]{display:none}' src/styles/site.css
          grep -q '>WhatsApp us</span>' src/lib/layout.mjs
          grep -q '>WhatsApp</span>' src/lib/layout.mjs
          grep -q 'data-track="whatsapp_click"' src/lib/layout.mjs
          grep -q 'data-whatsapp' src/lib/layout.mjs
          grep -q 'href="https://wa.me/' src/lib/layout.mjs
          grep -q '>Talk to a bathroom expert</button>' src/lib/layout.mjs
          grep -q '>Home consultation</span>' src/lib/layout.mjs
          grep -q 'fill="#25D366"' src/lib/layout.mjs

          grep -q '"indexable": false' src/config/site.json

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','style'): self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script','style') and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)

          for file in Path('dist').rglob('*.html'):
              html=file.read_text(encoding='utf-8')
              p=Visible(); p.feed(html)
              visible=' '.join(p.parts)
              if '07577 764742' in visible:
                  raise SystemExit(f'Phone number visible before reveal in {file}')

          about=Path('dist/about/index.html').read_text(encoding='utf-8')
          assert '/images/about/en-suites-shop-munster-road.webp' in about
          assert 'raw.githubusercontent.com/w14nrg/en-suite-bathrooms' not in about

          home=Path('dist/index.html').read_text(encoding='utf-8')
          assert 'WhatsApp us' in home
          assert 'Home consultation' in home
          assert 'whatsapp_click' in home
          assert 'Talk to a bathroom expert' in home
          PY
