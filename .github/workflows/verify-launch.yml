name: Verify Kensington launch

on:
  push:
    branches:
      - launch/contact-indexing-2026-09-28

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Verify launch requirements
        shell: bash
        run: |
          set -euo pipefail

          test -f public/fonts/inter-latin-wght-normal.woff2
          test -f public/fonts/libre-baskerville-latin-wght-normal.woff2

          grep -q '"indexable": true' src/config/site.json
          grep -q '"phone": "+447577764742"' src/config/site.json
          grep -q '"whatsapp": "447577764742"' src/config/site.json
          grep -q '"email": null' src/config/site.json
          grep -q '"endpoint": null' src/config/site.json

          grep -q 'Speak directly to Nicholas, our founder' src/lib/layout.mjs
          grep -q "Nicholas grew up locally and has decades of hands-on experience in bathrooms. You'll be talking to the person who plans your project." src/lib/layout.mjs
          grep -q 'Show phone number' src/lib/layout.mjs
          grep -q 'data-reveal-phone' src/scripts/site.js

          grep -q 'The business behind Kensington Bathrooms' src/pages/about.mjs
          grep -q 'Kensington Bathrooms is a trading name of En-Suites & Bathrooms Ltd, which also runs a high-street bathroom shop on Munster Road in Fulham. Our Kensington work is designed, supplied and managed from our local base in West Kensington.' src/pages/about.mjs
          grep -q 'En-Suites & Bathrooms shop, Munster Road, Fulham' src/pages/about.mjs
          grep -q 'Shopfront of the En-Suites & Bathrooms shop on Munster Road, Fulham' src/pages/about.mjs

          grep -q 'Renovating a Bathroom in Kensington: What to Check | Kensington Bathrooms' src/pages/guides/renovating-a-bathroom-in-kensington.mjs
          ! grep -R -q 'Nicholas to confirm' src
          ! grep -R -q 'Draft for Nicholas and Claude review' src
          ! grep -R -q 'Public phone, WhatsApp and email details will be added before launch' src
          ! grep -R -q 'fonts.googleapis.com\|fonts.gstatic.com' src public

          grep -q '^Allow: /$' dist/robots.txt
          grep -q '^Sitemap: https://kensingtonbathrooms.uk/sitemap.xml$' dist/robots.txt
          grep -q 'https://kensingtonbathrooms.uk/' dist/sitemap.xml
          grep -q 'https://kensingtonbathrooms.uk/about/' dist/sitemap.xml
          grep -q 'https://kensingtonbathrooms.uk/contact/' dist/sitemap.xml
          ! grep -q 'https://kensingtonbathrooms.uk/projects/' dist/sitemap.xml

          grep -q 'noindex, nofollow' dist/projects/index.html
          ! grep -q 'noindex, nofollow' dist/index.html
          ! grep -R -q '7386' dist
          ! grep -R -q 'en-suite.co.uk' dist

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const htmlFiles=[];
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) walk(p);
              else if(ent.name.endsWith('.html')) htmlFiles.push(p);
            }
          }
          walk('dist');

          for(const file of htmlFiles){
            const html=fs.readFileSync(file,'utf8');

            for(const m of html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)){
              JSON.parse(m[1]);
            }

            const textOnly=html
              .replace(/<script[\s\S]*?<\/script>/gi,' ')
              .replace(/<style[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ');
            if(textOnly.includes('07577 764742')){
              throw new Error('Phone number is visible text in '+file);
            }
          }

          const checks=[
            ['dist/index.html','/'],
            ['dist/bathroom-renovation/index.html','/bathroom-renovation/'],
            ['dist/our-approach/index.html','/our-approach/'],
            ['dist/areas/index.html','/areas/'],
            ['dist/areas/west-kensington/index.html','/areas/west-kensington/'],
            ['dist/areas/holland-park/index.html','/areas/holland-park/'],
            ['dist/areas/south-kensington/index.html','/areas/south-kensington/'],
            ['dist/areas/chelsea/index.html','/areas/chelsea/'],
            ['dist/about/index.html','/about/'],
            ['dist/contact/index.html','/contact/'],
            ['dist/guides/index.html','/guides/'],
            ['dist/guides/renovating-a-bathroom-in-kensington/index.html','/guides/renovating-a-bathroom-in-kensington/'],
            ['dist/privacy/index.html','/privacy/']
          ];
          for(const [file,url] of checks){
            if(!fs.existsSync(file)) throw new Error('Missing built page '+url);
          }

          const routes=new Set();
          for(const file of htmlFiles){
            const rel=path.relative('dist',file).replaceAll('\\','/');
            let route=rel==='index.html'?'/' : '/'+rel.replace(/index\.html$/,'');
            routes.add(route);
          }
          for(const file of htmlFiles){
            const html=fs.readFileSync(file,'utf8');
            for(const m of html.matchAll(/href="(\/[^"#?]*)/g)){
              const href=m[1];
              if(/\.[a-z0-9]+$/i.test(href)) continue;
              const route=href.endsWith('/')?href:href+'/';
              if(!routes.has(route)) throw new Error('Broken internal link '+href+' in '+file);
            }
          }
          NODE

          curl -fsSI --retry 3 https://raw.githubusercontent.com/w14nrg/en-suite-bathrooms/main/assets/shop/shop-front.webp >/dev/null
