name: Validate final Kensington feature

on:
  push:
    branches:
      - feature/chatgpt-premium-build

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v6
        with:
          ref: 23f743ceba3ee282ce6c6fc4073443055a00c853
          path: source

      - name: Build
        working-directory: source
        run: npm run build

      - name: Verify launch locks
        working-directory: source
        run: |
          set -euo pipefail
          grep -Fq '<meta name="robots" content="noindex, nofollow">' dist/index.html
          grep -Fq '<title>Bathroom Renovation in Kensington | Kensington Bathrooms</title>' dist/index.html
          grep -Fq '<h1 id="map-home-title">Bathroom design <br>and installation <br>in Kensington</h1>' dist/index.html
          grep -Fq 'We design, supply and install complete bathrooms across Kensington, West Kensington, Holland Park, South Kensington and Chelsea, working from our local base within this area.' dist/index.html
          grep -Fq 'id="kensington"' dist/index.html
          grep -Fq 'Areas we serve <span aria-hidden="true">◎</span> We' dist/index.html
          test "$(grep -o 'class="map-area-list"' dist/index.html | wc -l)" -eq 1
          test -f dist/guides/index.html
          test -f dist/guides/renovating-a-bathroom-in-kensington/index.html
          test -f dist/guides/mansion-block-bathroom-renovation/index.html
          test -f dist/guides/period-and-listed-home-bathrooms/index.html
          grep -Fq '/guides/renovating-a-bathroom-in-kensington/' dist/sitemap.xml
          grep -Fq '/guides/mansion-block-bathroom-renovation/' dist/sitemap.xml
          grep -Fq '/guides/period-and-listed-home-bathrooms/' dist/sitemap.xml
          ! grep -R "33 Gunterstone" dist
          ! grep -R "kynance-mews" src public
          ! grep -R "↗" src/pages src/lib
          ! grep -R 'data-kb-form="consultation"' dist/contact/index.html
          ! grep -R 'data-kb-form="callback"' dist/index.html

      - name: Verify guide schema and visible text
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=[
            Path('dist/guides/renovating-a-bathroom-in-kensington/index.html'),
            Path('dist/guides/mansion-block-bathroom-renovation/index.html'),
            Path('dist/guides/period-and-listed-home-bathrooms/index.html'),
          ]
          for p in pages:
              t=p.read_text()
              assert t.count('<h1') == 1, (p, t.count('<h1'))
              assert '"@type":"Article"' in t, p
              assert 'Nicholas to confirm' in t, p
          print('guide checks passed')
          PY

      - name: Create source zip
        run: |
          cd source
          zip -qr ../kensington-bathrooms-live-site-review-23f743c.zip . -x ".git/*" "dist/*"

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: kensington-bathrooms-live-site-review-23f743c
          path: kensington-bathrooms-live-site-review-23f743c.zip
          if-no-files-found: error
