name: Enforce Kensington HTTPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  https:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce HTTPS on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L             -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${{ github.repository }}/pages             -d '{"https_enforced":true}'
