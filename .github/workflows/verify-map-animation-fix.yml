name: Verify Claude map animation fix

on:
  push:
    branches:
      - feature/chatgpt-premium-build

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: 5881032419cdbcca49dda31dc34ed54deb2ea815
          path: site

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify no SEO/text drift and noindex
        run: |
          set -euo pipefail
          git clone -q --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" baseline
          cd baseline
          git checkout -q 378eb116dbe0a26fe1039458ee96a07a725744b4
          npm run build >/dev/null
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import re
          b=Path('baseline/dist')
          c=Path('site/dist')
          assert (Path('site/src/config/site.json').read_text().find('"indexable": false')!=-1)
          def norm(s):
              s=re.sub(r'<style>.*?</style>','<style></style>',s,flags=re.S)
              s=s.replace("<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('js-motion')</script>","")
              return s
          bp=sorted(p.relative_to(b) for p in b.rglob('*.html'))
          cp=sorted(p.relative_to(c) for p in c.rglob('*.html'))
          assert bp==cp
          for rel in bp:
              assert norm((b/rel).read_text())==norm((c/rel).read_text()), rel
          print('SEO_TEXT_STRUCTURE_UNCHANGED',len(cp))
          PY

      - name: Serve site
        run: |
          python3 -m http.server 4173 -d site/dist >/tmp/kb-mapfix.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ >/dev/null

      - name: Verify visible map animation, reduced motion, and no-JS fallback
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              // Normal motion.
              const page=await browser.newPage();
              await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'no-preference'}]);
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              const initial=await page.evaluate(()=>({
                jsMotion:document.documentElement.classList.contains('js-motion'),
                road:getComputedStyle(document.querySelector('.map-art>g:nth-of-type(1) path')).animationName,
                roadDash:getComputedStyle(document.querySelector('.map-art>g:nth-of-type(1) path')).strokeDasharray,
                pinNames:[...document.querySelectorAll('.map-point__button')].map(x=>getComputedStyle(x).animationName),
                pinDelays:[...document.querySelectorAll('.map-point__button')].map(x=>getComputedStyle(x).animationDelay),
                pinOpacity:[...document.querySelectorAll('.map-point__button')].map(x=>Number(getComputedStyle(x).opacity)),
                pulseBefore:getComputedStyle(document.querySelector('.map-point--local-base .map-point__symbol'),'::before').animationName,
                pulseDelay:getComputedStyle(document.querySelector('.map-point--local-base .map-point__symbol'),'::before').animationDelay
              }));
              if(!initial.jsMotion) throw new Error('js-motion not set before map animation');
              if(initial.road!=='kb-map-draw'||!initial.roadDash.includes('1400')) throw new Error('road draw animation missing '+JSON.stringify(initial));
              if(initial.pinNames.some(x=>x!=='kb-pin-drop')) throw new Error('pin drop animation missing '+JSON.stringify(initial));
              if(new Set(initial.pinDelays).size<6) throw new Error('pins are not staggered '+JSON.stringify(initial.pinDelays));
              if(initial.pinOpacity.some(x=>x!==0)) throw new Error('pins were visible at animation start '+JSON.stringify(initial.pinOpacity));
              if(initial.pulseBefore!=='kb-local-pulse') throw new Error('local pulse missing');
              console.log('MAP_INITIAL',JSON.stringify(initial));

              await sleep(1450);
              const mid=await page.evaluate(()=>[...document.querySelectorAll('.map-point__button')].map(x=>Number(getComputedStyle(x).opacity)));
              if(!(mid[0]>0.9 && mid[5]<0.2)) throw new Error('pins not visibly dropping in sequence '+JSON.stringify(mid));
              console.log('MAP_PIN_SEQUENCE',JSON.stringify(mid));

              await sleep(1500);
              const late=await page.evaluate(()=>({
                pins:[...document.querySelectorAll('.map-point__button')].map(x=>Number(getComputedStyle(x).opacity)),
                pulseOpacity:Number(getComputedStyle(document.querySelector('.map-point--local-base .map-point__symbol'),'::before').opacity),
                pulseTransform:getComputedStyle(document.querySelector('.map-point--local-base .map-point__symbol'),'::before').transform
              }));
              if(late.pins.some(x=>x<0.99)) throw new Error('pins did not finish visible '+JSON.stringify(late));
              if(!(late.pulseOpacity>0 || late.pulseTransform!=='none')) throw new Error('local marker pulse not active '+JSON.stringify(late));
              console.log('MAP_LATE',JSON.stringify(late));
              await page.close();

              // Reduced motion must show everything without animation.
              const reduced=await browser.newPage();
              await reduced.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);
              await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle0'});
              const rm=await reduced.evaluate(()=>({
                jsMotion:document.documentElement.classList.contains('js-motion'),
                pins:[...document.querySelectorAll('.map-point__button')].map(x=>Number(getComputedStyle(x).opacity)),
                roadAnimation:getComputedStyle(document.querySelector('.map-art>g:nth-of-type(1) path')).animationName,
                h1:getComputedStyle(document.querySelector('h1')).visibility
              }));
              if(rm.jsMotion||rm.pins.some(x=>x<0.99)||rm.roadAnimation!=='none'||rm.h1!=='visible') throw new Error('reduced-motion fallback failed '+JSON.stringify(rm));
              console.log('REDUCED_MOTION_OK',JSON.stringify(rm));
              await reduced.close();

              // No JavaScript: html.js-motion is never added, all content/map remain visible.
              const nojs=await browser.newPage();
              await nojs.setJavaScriptEnabled(false);
              await nojs.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle0'});
              const nj=await nojs.evaluate(()=>({
                jsMotion:document.documentElement.classList.contains('js-motion'),
                pins:[...document.querySelectorAll('.map-point__button')].map(x=>Number(getComputedStyle(x).opacity)),
                roadAnimation:getComputedStyle(document.querySelector('.map-art>g:nth-of-type(1) path')).animationName,
                h1Text:document.querySelector('h1')?.textContent.trim(),
                mainText:(document.querySelector('main')?.innerText||'').length
              }));
              if(nj.jsMotion||nj.pins.some(x=>x<0.99)||nj.roadAnimation!=='none'||!nj.h1Text||nj.mainText<500) throw new Error('no-JS visibility failed '+JSON.stringify(nj));
              console.log('NO_JS_OK',JSON.stringify(nj));
              await nojs.close();
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lighthouse mobile homepage
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npx -y lighthouse@12.2.1 http://127.0.0.1:4173/             --only-categories=performance             --output=json             --output-path=/tmp/lh.json             --chrome-path="$CHROME"             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --quiet
          node <<'NODE'
          const j=require('/tmp/lh.json');
          console.log('LIGHTHOUSE performance='+Math.round(j.categories.performance.score*100)+' lcp_ms='+Math.round(j.audits['largest-contentful-paint'].numericValue)+' cls='+j.audits['cumulative-layout-shift'].numericValue.toFixed(4));
          NODE
