name: Verify live Kensington launch

on:
  push:
    branches:
      - launch/contact-indexing-2026-09-28

permissions:
  contents: read
  pages: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Read GitHub Pages HTTPS setting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          echo "${json}" | python3 -c 'import json,sys; j=json.load(sys.stdin); print("cname=",j.get("cname")); print("https_enforced=",j.get("https_enforced")); print("status=",j.get("status")); assert j.get("cname")=="kensingtonbathrooms.uk"'

      - name: Check canonical redirects and TLS
        run: |
          set -euo pipefail
          check_final () {
            label="$1"; url="$2"
            result="$(curl -sS -L --max-redirs 8 -o /dev/null -w '%{http_code} %{url_effective}' "$url")"
            echo "$label $result"
            code="${result%% *}"
            final="${result#* }"
            test "$code" = "200"
            case "$final" in
              https://kensingtonbathrooms.uk/|https://kensingtonbathrooms.uk) ;;
              *) echo "Unexpected canonical destination: $final"; exit 1 ;;
            esac
          }
          check_final HTTP_APEX http://kensingtonbathrooms.uk/
          check_final HTTP_WWW http://www.kensingtonbathrooms.uk/
          check_final HTTPS_WWW https://www.kensingtonbathrooms.uk/
          curl -fsS --proto '=https' --tlsv1.2 https://kensingtonbathrooms.uk/ >/dev/null

      - name: Check live pages
        run: |
          set -euo pipefail
          paths=(
            "/"
            "/bathroom-renovation/"
            "/our-approach/"
            "/areas/"
            "/areas/west-kensington/"
            "/areas/holland-park/"
            "/areas/south-kensington/"
            "/areas/chelsea/"
            "/about/"
            "/contact/"
            "/guides/"
            "/guides/renovating-a-bathroom-in-kensington/"
            "/guides/mansion-block-bathroom-renovation/"
            "/guides/period-and-listed-home-bathrooms/"
            "/projects/"
            "/privacy/"
            "/cookies/"
            "/terms/"
          )
          for p in "${paths[@]}"; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "https://kensingtonbathrooms.uk${p}")"
            echo "${p} ${code}"
            test "${code}" = "200"
          done

      - name: Check live robots, sitemap and launch content
        run: |
          set -euo pipefail
          curl -fsS https://kensingtonbathrooms.uk/robots.txt -o /tmp/robots.txt
          curl -fsS https://kensingtonbathrooms.uk/sitemap.xml -o /tmp/sitemap.xml
          curl -fsS https://kensingtonbathrooms.uk/ -o /tmp/home.html
          curl -fsS https://kensingtonbathrooms.uk/about/ -o /tmp/about.html
          curl -fsS https://kensingtonbathrooms.uk/projects/ -o /tmp/projects.html

          grep -q '^Allow: /$' /tmp/robots.txt
          grep -q '^Sitemap: https://kensingtonbathrooms.uk/sitemap.xml$' /tmp/robots.txt

          for p in             "/"             "/bathroom-renovation/"             "/our-approach/"             "/guides/"             "/guides/renovating-a-bathroom-in-kensington/"             "/guides/mansion-block-bathroom-renovation/"             "/guides/period-and-listed-home-bathrooms/"             "/about/"             "/areas/"             "/areas/west-kensington/"             "/areas/holland-park/"             "/areas/south-kensington/"             "/areas/chelsea/"             "/contact/"             "/privacy/"             "/cookies/"             "/terms/"; do
            grep -q "<loc>https://kensingtonbathrooms.uk${p}</loc>" /tmp/sitemap.xml
          done
          ! grep -q '<loc>https://kensingtonbathrooms.uk/projects/</loc>' /tmp/sitemap.xml
          grep -q 'noindex, nofollow' /tmp/projects.html
          ! grep -q 'noindex, nofollow' /tmp/home.html

          grep -q 'Speak directly to Nicholas, our founder' /tmp/home.html
          grep -q 'The business behind Kensington Bathrooms' /tmp/about.html
          grep -q 'En-Suites & Bathrooms shop, Munster Road, Fulham' /tmp/about.html

          ! grep -R -q '7386' /tmp/home.html /tmp/about.html /tmp/projects.html
          ! grep -R -q 'en-suite.co.uk' /tmp/home.html /tmp/about.html /tmp/projects.html

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import urlopen

          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'):
                      self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.skip:
                      self.skip-=1
              def handle_data(self,data):
                  if not self.skip:
                      self.parts.append(data)

          paths = [
            '/', '/bathroom-renovation/', '/our-approach/', '/areas/',
            '/areas/west-kensington/', '/areas/holland-park/',
            '/areas/south-kensington/', '/areas/chelsea/', '/about/',
            '/contact/', '/guides/',
            '/guides/renovating-a-bathroom-in-kensington/',
            '/guides/mansion-block-bathroom-renovation/',
            '/guides/period-and-listed-home-bathrooms/', '/projects/',
            '/privacy/', '/cookies/', '/terms/'
          ]
          for path in paths:
              html=urlopen('https://kensingtonbathrooms.uk'+path).read().decode()
              p=Visible(); p.feed(html)
              visible=' '.join(p.parts)
              assert '07577 764742' not in visible, path
          PY
