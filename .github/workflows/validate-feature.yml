name: Validate and export Kensington feature

on:
  push:
    branches:
      - feature/chatgpt-premium-build

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v6
        with:
          ref: 7315744fe4ac9426d3f1b44ee0809a9f044c664e
          path: source

      - name: Build
        working-directory: source
        run: npm run build

      - name: Verify protected content and guide output
        working-directory: source
        run: |
          set -euo pipefail
          grep -Fq '<meta name="robots" content="noindex, nofollow">' dist/index.html
          grep -Fq '<h1 id="map-home-title">Bathroom design <br>and installation <br>in Kensington</h1>' dist/index.html
          grep -Fq 'id="kensington"' dist/index.html
          grep -Fq 'https://kensingtonbathrooms.uk/' dist/index.html
          test -f dist/guides/index.html
          test -f dist/guides/renovating-a-bathroom-in-kensington/index.html
          test -f dist/guides/mansion-block-bathroom-renovation/index.html
          test -f dist/guides/period-and-listed-home-bathrooms/index.html
          grep -Fq '/guides/renovating-a-bathroom-in-kensington/' dist/sitemap.xml
          grep -Fq '/guides/mansion-block-bathroom-renovation/' dist/sitemap.xml
          grep -Fq '/guides/period-and-listed-home-bathrooms/' dist/sitemap.xml
          ! grep -R "kynance-mews" src public || false
          ! grep -R "↗" src/pages src/lib || false

      - name: Verify one H1 per guide
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [
              Path('dist/guides/renovating-a-bathroom-in-kensington/index.html'),
              Path('dist/guides/mansion-block-bathroom-renovation/index.html'),
              Path('dist/guides/period-and-listed-home-bathrooms/index.html'),
          ]:
              text=p.read_text()
              n=text.count('<h1')
              assert n==1, (p,n)
          print('guide H1 checks passed')
          PY

      - name: Create source zip
        run: |
          cd source
          zip -qr ../kensington-bathrooms-live-site-review-7315744.zip . -x ".git/*" "dist/*"

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: kensington-bathrooms-live-site-review-7315744
          path: kensington-bathrooms-live-site-review-7315744.zip
          if-no-files-found: error
