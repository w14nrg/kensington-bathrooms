name: Export corrected Kensington review

on:
  push:
    branches:
      - feature/chatgpt-premium-build

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrected review commit
        uses: actions/checkout@v6
        with:
          ref: 426920bc5e88df78ee7d729329c63a4cfbf17b53
          path: source

      - name: Verify no En-Suites contact details remain
        working-directory: source
        run: |
          set -euo pipefail
          ! grep -R "0207 386 0000" src docs
          ! grep -R "442073860000" src docs
          ! grep -R "info@en-suite.co.uk" src docs
          ! grep -R "en-suite.co.uk" src docs
          grep -Fq '"phone": null' src/config/site.json
          grep -Fq '"whatsapp": null' src/config/site.json
          grep -Fq '"email": null' src/config/site.json
          npm run build

      - name: Create corrected source zip
        run: |
          cd source
          zip -qr ../kensington-bathrooms-live-site-review-corrected-426920b.zip . -x ".git/*" "dist/*"

      - name: Upload corrected zip
        uses: actions/upload-artifact@v4
        with:
          name: kensington-bathrooms-live-site-review-corrected-426920b
          path: kensington-bathrooms-live-site-review-corrected-426920b.zip
          if-no-files-found: error
